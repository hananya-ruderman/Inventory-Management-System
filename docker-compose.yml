services:

  postgres:
    image: postgres:16
    container_name: inventory-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
      container_name: inventory-backend

      build:
        context: ./backend
      ports:
        - "3000:3000"
      env_file:
        - .env
      depends_on:
        - postgres

  frontend:
    build:
      context: ./frontend
    container_name: inventory-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      
volumes:
  postgres_data: