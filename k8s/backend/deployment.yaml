apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: inventory


spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: inventory-management-project-backend:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

                    
          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret