apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: inventory

spec:
  replicas: 3

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: inventory-management-project-frontend:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 80